[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iomtlab"
version = "0.1.0"
description = "IoT/IoMT labs: human activity recognition from signal to federated learning"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "torch>=2.4",
    "scipy>=1.12",
    "scikit-learn>=1.3",          # metrics (train.evaluate), random forest in Lab 3
]

[project.optional-dependencies]
# MQTT client (Labs 0 and 1).
net = ["paho-mqtt>=2.0"]
# tests, notebook execution (nbmake, used by scripts/check_course.py), Jupyter
dev = ["pytest>=8", "nbmake", "jupyterlab"]

[tool.hatch.build.targets.wheel]
packages = ["src/iomtlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
